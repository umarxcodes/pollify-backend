name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Format & Audit
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      CI: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install Dependencies
        run: HUSKY=0 yarn install --frozen-lockfile

      - name: Run Linter
        run: yarn lint

      - name: Check Formatting
        run: yarn format:check

      - name: Security Audit
        run: yarn audit --audit-level moderate || echo "Audit found issues or failed; review manually"

      - name: Upload Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: |
            src/
            .env.example
            package.json
            yarn.lock
            vercel.json
            Dockerfile
            docker-compose.yml
            README.md
          retention-days: 7
