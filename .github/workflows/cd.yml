name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.head_branch == 'development' ||
          github.event.workflow_run.head_branch == 'main') }}

    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs['url'] }}
      # Vercel auto-injects: VERCEL_URL, VERCEL_PROJECT_URL, etc.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        id: vercel_env
        run: |
          vercel pull --yes --environment=${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'preview' }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build on Vercel
        id: build
        run: |
          vercel build --yes --environment=${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'preview' }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          vercel deploy --prebuilt --yes --environment=${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'preview' }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Output Deployment URL
        run: echo "Deployed to: ${{ steps.deploy.outputs['url'] }}"
